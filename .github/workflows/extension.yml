name: VS Code Extension Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

jobs:
  package-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release versions and tag
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const packages = ['core', 'cli', 'server', 'client-vscode', 'simulator'];
          const version = JSON.parse(fs.readFileSync('packages/client-vscode/package.json')).version;
          for (const name of packages) assert.equal(JSON.parse(fs.readFileSync(`packages/${name}/package.json`)).version, version, `${name} version mismatch`);
          if (process.env.GITHUB_REF_TYPE === 'tag') assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Tag must match package versions');
          assert.ok(fs.readFileSync('packages/client-vscode/CHANGELOG.md', 'utf8').includes(`## ${version}\n`));
          NODE

      - name: Lint (all packages)
        run: pnpm -r lint

      - name: Build (all packages)
        run: pnpm -r build

      - name: Test (all packages)
        run: pnpm -r test

      - name: Bundle server into client
        run: pnpm -C packages/client-vscode bundle:server

      - name: Build client bundle
        run: pnpm -C packages/client-vscode bundle

      - name: Package VSIX
        run: pnpm -C packages/client-vscode package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-lsl-lsp-vsix
          path: packages/client-vscode/*.vsix

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsl-lsp-cli
          path: |
            packages/cli/out/lsl-lsp.cjs
            packages/cli/out/lsl-lsp.cjs.map

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsl-lsp-simulator
          if-no-files-found: error
          path: |
            packages/simulator/out/lsl-simulator.cjs
            packages/simulator/out/lsl-simulator.cjs.map
            packages/simulator/out/lsl-simulator.d.cts
            packages/simulator/out/lsl-simulator.LICENSE.txt

      - name: Add run summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## ✅ VSIX artifact ready";
            echo;
            echo "- Open the run: ${RUN_URL}";
            echo "- Download from the Artifacts section: vscode-lsl-lsp-vsix";
            echo "- CLI bundle artifact: lsl-lsp-cli";
            echo "- Simulator library artifact: lsl-lsp-simulator";
            echo;
            echo "Tip (GitHub CLI):";
            echo "\`gh run download ${{ github.run_id }} -n vscode-lsl-lsp-vsix\`";
            echo "\`gh run download ${{ github.run_id }} -n lsl-lsp-cli\`";
            echo "\`gh run download ${{ github.run_id }} -n lsl-lsp-simulator\`";
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish Release (on tags)
    needs: package-extension
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-lsl-lsp-vsix
          path: release-assets

      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: lsl-lsp-cli
          path: release-assets

      - name: Download simulator artifact
        uses: actions/download-artifact@v4
        with:
          name: lsl-lsp-simulator
          path: release-assets

      - name: Verify pipeline VSIX and record provenance
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess, zipfile
          assets = pathlib.Path('release-assets')
          files = list(assets.glob('*.vsix'))
          assert len(files) == 1
          with zipfile.ZipFile(files[0]) as z:
              package = json.loads(z.read('extension/package.json'))
          assert package['publisher'] == 'Sekkmer'
          assert package['name'] == 'vscode-lsl-lsp'
          assert os.environ['RELEASE_TAG'] == 'v' + package['version']
          record = {k: os.environ[k] for k in ['RELEASE_REPOSITORY', 'RELEASE_RUN_ID', 'RELEASE_RUN_ATTEMPT', 'RELEASE_TAG']}
          record['commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          record['vsixArtifact'] = 'vscode-lsl-lsp-vsix'
          record['vsixSha256'] = hashlib.sha256(files[0].read_bytes()).hexdigest()
          (assets / 'RELEASE_PROVENANCE.json').write_text(json.dumps(record, indent=2) + '\n')
          sums = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name for p in sorted(assets.iterdir()) if p.is_file() and p.name != 'SHA256SUMS']
          (assets / 'SHA256SUMS').write_text('\n'.join(sums) + '\n')
          PYCODE

      - name: Build release notes from changelog
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          awk -v version="${version}" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/client-vscode/CHANGELOG.md | sed '${/^$/d;}' > "${notes_file}"

          if [[ ! -s "${notes_file}" ]]; then
            echo "No changelog section found for ${version}" >&2
            exit 1
          fi

          previous_tag="$(git tag --sort=-v:refname | awk -v tag="${tag}" '$0 == tag { seen = 1; next } seen && /^v[0-9]/ { print; exit }')"
          if [[ -n "${previous_tag}" ]]; then
            {
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${tag}"
            } >> "${notes_file}"
          fi

          echo "path=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            release-assets/*.vsix
            release-assets/lsl-lsp.cjs
            release-assets/lsl-lsp.cjs.map
            release-assets/lsl-simulator.cjs
            release-assets/lsl-simulator.cjs.map
            release-assets/lsl-simulator.d.cts
            release-assets/lsl-simulator.LICENSE.txt
            release-assets/SHA256SUMS
            release-assets/RELEASE_PROVENANCE.json
          fail_on_unmatched_files: true
      - name: Setup Node.js for Marketplace publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish the verified pipeline VSIX to Marketplace
        run: npm exec --yes --package=@vscode/vsce@4.1.0 -- vsce publish --oidc --packagePath release-assets/*.vsix
